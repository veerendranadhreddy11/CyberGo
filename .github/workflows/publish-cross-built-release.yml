name: Publish verified CyberGo packages

on:
  workflow_dispatch:
    inputs:
      platform_run:
        description: Run ID with verified Windows x64 and Intel macOS packages
        required: true
        type: string
      silicon_run:
        description: Optional run ID with the verified Apple Silicon cross-build
        required: false
        type: string
        default: ""

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.0.0
      - uses: actions/download-artifact@v4
        with:
          name: CyberGo-Windows-x64
          path: release
          run-id: ${{ inputs.platform_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: CyberGo-macOS-Intel
          path: release
          run-id: ${{ inputs.platform_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: inputs.silicon_run != ''
        with:
          name: CyberGo-macOS-AppleSilicon
          path: release
          run-id: ${{ inputs.silicon_run }}
          github-token: ${{ github.token }}
      - name: Validate package contents and checksums
        working-directory: release
        env:
          EXPECTED_COUNT: ${{ inputs.silicon_run == '' && '4' || '6' }}
        run: |
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "$EXPECTED_COUNT"
          for item in *.zip; do unzip -tq "$item"; done
          sha256sum *.zip *.dmg *.exe > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt
      - name: Publish v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
          INCLUDE_SILICON: ${{ inputs.silicon_run != '' }}
        run: |
          notes="$(mktemp)"
          cat docs/Release_Notes_v1.0.0.md > "$notes"
          if [[ "$INCLUDE_SILICON" == "true" ]]; then
            printf '\nThe Apple Silicon DMG was cross-built on an Intel Mac and its ARM64 executable and disk image were verified. A launch test on Apple Silicon remains pending.\n' >> "$notes"
          else
            printf '\nThe Windows x64 and Intel macOS packages passed installation or disk-image startup checks and are available below. Apple Silicon verification is in progress.\n' >> "$notes"
          fi
          if gh release view v1.0.0 --json url >/dev/null 2>&1; then
            if [[ "$INCLUDE_SILICON" == "true" ]]; then
              gh release upload v1.0.0 release/CyberGo-macOS-AppleSilicon.dmg release/CyberGo-v1.0.0-macOS-AppleSilicon.zip
              gh release upload v1.0.0 release/SHA256SUMS.txt --clobber
              gh release edit v1.0.0 --notes-file "$notes"
            fi
          else
            gh release create v1.0.0 release/* --verify-tag --title "CyberGo v1.0.0" --notes-file "$notes"
          fi
          gh release view v1.0.0 --json url,assets
